[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
# Matches the inspected v4-core d153b048 build config exactly (ARCH 3.0/3.3 pin): 0.8.26/Cancun.
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
# via_ir: PayGuardVault.executePayment has enough calldata params + locals (6 signed
# inputs, a 4-tuple _evaluate return, several derived locals) to hit solc legacy
# codegen stack-too-deep limit. via-ir removes that ceiling; ABI/behavior unaffected.
via_ir = true
bytecode_hash = "none"
fs_permissions = [{ access = "read", path = "./" }, { access = "read-write", path = "../../docs/implementation/evidence" }]

[profile.default.fuzz]
runs = 256

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
